site_name: PyTank

nav:
  - Home: index.md
  - Getting Started: nav/Getting-Started.md
  - User Guide:
      - nav/setup/user_guide.md
  - Development:
      - nav/development/development-guide.md
      - nav/development/release-notes.md
  - API reference:
      - nav/API/api_reference.md

theme:
  name: material
  favicon: static/Icon.ico
  logo: static/Icon.png
  theme_style: light
  site_name_style: normal
  title_style: bold
  colors:
    text: black
    title: black
    primary: black
    background: white
  components:
    site_name: true
    title: false
    menu: true
    preview: true
    footer: true

markdown_extensions:
  - attr_list
  - md_in_html
